spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO}
    properties:
      hibernate:
        format_sql: true
    show-sql: true

jwt:
  secret: "${JWT_SECRET}"
  access-exp-seconds: 86400 # 1일
  refresh-exp-seconds: 2592000 # 30일

logging:
  level:
    org.springframework.security: DEBUG
    # 임시 진단용 — CloudWatch push가 운영에서 조용히 성공/실패하는지 확인한 뒤 제거한다.
    io.micrometer: DEBUG
    software.amazon.awssdk: DEBUG

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  metrics:
    enable:
      all: false
      jvm:
        memory: true
        gc: true
        threads: true
  # Spring Boot 3.x는 CloudWatch export 자동 설정을 제공하지 않아 이 값은 Spring이 자동으로
  # 바인딩하지 않는다 — CloudWatchMetricsConfig(global/config)가 @ConditionalOnProperty로
  # enabled만 직접 읽고, namespace/step/batchSize는 그 클래스 안에 하드코딩돼 있다.
  cloudwatch:
    metrics:
      export:
        enabled: ${CLOUDWATCH_METRICS_ENABLED:false}

kakao:
  auth:
    base-url: https://kapi.kakao.com
  local:
    base-url: https://dapi.kakao.com
    rest-api-key: ${KAKAO_REST_API_KEY}

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH}
