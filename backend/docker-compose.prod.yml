services:
  app:
    # 이미지 주소는 APP_IMAGE 환경변수로 분리. 미설정 시 아래 기본값으로 폴백(하위 호환).
    image: ${APP_IMAGE}
    container_name: myapp
    ports:
      - "80:8080"
    depends_on:
      - redis
    env_file:
      - .env
    # FIREBASE_CREDENTIALS_PATH(./gilbut-firebase-adminsdk.json)가 컨테이너 워킹 디렉터리(/app) 기준으로
    # 해석되므로, 같은 이름으로 읽기 전용 마운트한다. 파일 자체는 CI가 아니라 운영자가 EC2에 직접 배치한다.
    volumes:
      - ./gilbut-firebase-adminsdk.json:/app/gilbut-firebase-adminsdk.json:ro
    # 컨테이너 메모리 천장(cgroup). "피크×1.3~1.5배" 마진 규칙은 이 인스턴스에서 물리 메모리
    # 자체를 넘어서(피크 실측 최대 728.5MiB 기준 947~1093MiB 필요, t3.micro 가용은 913MiB뿐)
    # 성립하지 않아, 대신 호스트가 절대 메모리 부족에 빠지지 않도록 물리 예산을 엄격히 나눠
    # 역산했다: 913(가용) - 230(OS+dockerd) - 40(redis mem_limit) = 643 → 640m.
    # 힙 상한은 기본 ergonomics로 160MB(=640m의 25%). 앱의 진짜 수요(swap-free 추정
    # ~700~730MiB)보다 작게 잡은 값이라, 초과분은 swap이 상시적으로 흡수하는 걸 전제로 한다.
    # 산출 과정: docs/tech/infra/EC2 응답 불능 문제 해결하기.md
    mem_limit: 640m
    restart: always

  redis:
    image: redis:7
    container_name: redis
    volumes:
      - redis-data:/data
    # maxmemory로 Redis 사용량 고정. RefreshToken 저장소라 상한 초과 시 오래된 키부터 축출(LRU).
    # 캡스톤 프로젝트라 실가입자 수가 매우 적어 20mb로 재산정(기존 100mb는 검증 없이 물려받은
    # 값이었음, 실제 필요량 대비 20~60배 여유). mem_limit 40m은 maxmemory 20mb + 프로세스
    # 오버헤드·AOF 재작성(BGREWRITEAOF) 시 fork COW 스파이크 대비 20MB(운영 실측 RSS는
    # 4.5MB로 여유 있음). 실 가입자 수가 늘면 재산출 필요.
    command: redis-server --appendonly yes --maxmemory 20mb --maxmemory-policy allkeys-lru
    mem_limit: 40m
    restart: always

volumes:
  redis-data: